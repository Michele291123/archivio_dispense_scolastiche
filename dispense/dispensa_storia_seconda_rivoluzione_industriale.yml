titolo: "Dalla Terza guerra d'indipendenza alla Seconda rivoluzione industriale"
descrizione: "Riassunto di storia: Terza guerra d'indipendenza e Roma capitale, Seconda rivoluzione industriale (1870-1920), taylorismo e fordismo, tabella delle invenzioni, emigrazione italiana, Grande depressione (1873-1896) e protezionismo. Con linea del tempo e domande di ripasso."
autore: "Michele A. + Claude"
materia: "Storia"
