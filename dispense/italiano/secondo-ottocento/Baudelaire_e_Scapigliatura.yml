titolo: "Dal Regno d'Italia a Cuore e Pinocchio"
descrizione: "Dispensa riassuntiva sull'Italia appena unita, il Positivismo e Darwin, Baudelaire e \"I fiori del male\", lo spleen da Baudelaire a Moravia, \"L'albatro\", la Scapigliatura e la narrativa dopo l'Unità: De Amicis e \"Cuore\", Collodi e \"Pinocchio\". Con tabelle, date da ricordare, domande dell'interrogazione e domande di ripasso con risposte."
autore: "Michele A. + Claude"
materia: "Italiano"
argomento: "Secondo Ottocento"
