titolo: Dal Regno d'Italia alla Scapigliatura
descrizione: Dispensa riassuntiva sull'Italia appena unita, il Positivismo e Darwin, Baudelaire e "I fiori del male", lo spleen da Baudelaire a Moravia, "L'albatro" e la Scapigliatura, con tabelle, date da ricordare e domande di ripasso.
autore: Michele A. + Claude
materia: Italiano
argomento: "Secondo Ottocento"
