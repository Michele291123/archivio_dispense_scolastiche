titolo: "Dalla Terza guerra d'indipendenza alla Seconda rivoluzione industriale"
descrizione: "Riassunto di storia: Terza guerra d'indipendenza e Roma capitale, l'Italia di fine Ottocento tra Destra e Sinistra storica (ferrovie, trasformismo, programma di Depretis), Seconda rivoluzione industriale (1870-1920), taylorismo e fordismo, tabella delle invenzioni, emigrazione italiana, Grande depressione (1873-1896) e protezionismo. Con linea del tempo, riassunto e domande di ripasso con risposte."
autore: "Michele A. + Claude"
materia: "Storia"
argomento: "Quinto anno"
