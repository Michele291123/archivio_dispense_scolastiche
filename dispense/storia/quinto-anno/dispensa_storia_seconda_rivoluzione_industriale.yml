titolo: "Dalla Terza guerra d'indipendenza alla Seconda rivoluzione industriale"
descrizione: "Riassunto di storia in ordine cronologico: l'Italia unita e la Destra storica, Terza guerra d'indipendenza e Roma capitale, Seconda rivoluzione industriale (1870-1920) con taylorismo, fordismo e tabella delle invenzioni, l'età dell'imperialismo (motivazioni, Cina e Giappone), Grande depressione (1873-1896) e protezionismo, la Sinistra storica di Depretis (malcontento, trasformismo, riformismo moderato, crisi agraria), l'emigrazione italiana. Con linea del tempo, riassunto e domande di ripasso con risposte."
autore: "Michele A. + Claude"
materia: "Storia"
argomento: "Quinto anno"
