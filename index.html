<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivio dispense</title>
  <meta name="description" content="Archivio di dispense scolastiche divise per materia.">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preload" href="assets/fonts/barlow-condensed-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Va caricato qui, prima del body: applica il tema salvato senza sfarfallii -->
  <script src="js/boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenuto">Vai al contenuto</a>

  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="#/" aria-label="Archivio dispense, torna alle cartelle">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M2 6.5A2.5 2.5 0 0 1 4.5 4h4.3c.7 0 1.4.3 1.9.8L12 6.2h7.5A2.5 2.5 0 0 1 22 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.5z"/>
        </svg>
        <span class="brand__name">Dispense</span>
      </a>

      <label class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.6-3.6"/>
        </svg>
        <input id="search" type="search" placeholder="Cerca" aria-label="Cerca una dispensa" autocomplete="off" spellcheck="false">
        <kbd class="search__key" aria-hidden="true">/</kbd>
      </label>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Passa al tema chiaro">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="contenuto" class="container page" tabindex="-1">
    <!-- Contenuto iniziale: viene sostituito da js/app.js appena l'archivio è caricato -->
    <p class="state state--loading">Carico l'archivio…</p>

    <section class="state state--file">
      <h1 class="state__title">Apri il sito da un server web</h1>
      <p class="state__text">Aperta con un doppio clic, la pagina non può leggere i file delle dispense: il browser lo blocca. Avvia un server nella cartella del progetto:</p>
      <pre class="state__code"><code>python -m http.server 8000</code></pre>
      <p class="state__text">poi apri <code>http://localhost:8000</code>.</p>
    </section>

    <noscript><p class="state">Per vedere l'archivio serve JavaScript attivo.</p></noscript>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
